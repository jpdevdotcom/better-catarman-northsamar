<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BetterCatarman promo slides</title>
<!--
  Social media slides for BetterCatarman. Each slide is 1080 x 1080 CSS pixels and is
  rendered at 2x (2160 x 2160) by render.sh. Screens inside the device frames are live
  views of the site, so the dev server must be running (see SITE below).
  Open this file with ?s=0 … ?s=7 to see one slide, or with no query to see them all.
-->
<style>
@font-face {
  font-family: "Public Sans";
  src: url("../node_modules/@fontsource-variable/public-sans/files/public-sans-latin-wght-normal.woff2") format("woff2");
  font-weight: 100 900;
}
:root {
  --blue: #1d4ed8;
  --blue-bright: #2563eb;
  --blue-deep: #1741b6;
  --navy: #0b1f44;
  --sun: #ebcb4b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #111; font-family: "Public Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
body.single { background: none; overflow: hidden; }
body:not(.single) .slide { margin: 24px auto; }

.slide {
  position: relative; width: 1080px; height: 1080px; overflow: hidden; color: #fff;
  background:
    repeating-radial-gradient(circle at 88% 4%, rgba(255,255,255,.055) 0 1.5px, transparent 1.5px 74px),
    radial-gradient(circle at 20% 15%, #2f6cf0 0%, transparent 55%),
    linear-gradient(165deg, var(--blue-bright) 0%, var(--blue) 55%, var(--blue-deep) 100%);
}
/* White diagonal wedge at the bottom. --a and --b are the left and right heights. */
.wedge { position: absolute; inset: 0; background: #fff; clip-path: polygon(0 var(--a), 100% var(--b), 100% 100%, 0 100%); }

.top { position: absolute; left: 60px; right: 60px; top: 48px; display: flex; align-items: center; justify-content: space-between; z-index: 5; }
.brand { display: flex; align-items: center; gap: 14px; font-size: 25px; font-weight: 700; letter-spacing: -.01em; }
.brand img { width: 46px; height: 46px; background: #fff; padding: 5px; }
.brand span { display: flex; flex-direction: column; line-height: 1; }
.brand b { font-weight: 700; }
.brand i { font-style: normal; font-size: 17px; font-weight: 600; opacity: .8; }
.brand small { margin-top: 6px; font-size: 13px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; opacity: .8; }
.place { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 600; opacity: .9; }
.place svg { width: 18px; height: 18px; }

.tag {
  display: inline-flex; align-items: center; gap: 10px; padding: 8px 14px;
  border: 1.5px solid rgba(255,255,255,.45); background: rgba(255,255,255,.1);
  font-size: 15px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
}
.tag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--sun); }
h1 { font-weight: 800; letter-spacing: -.035em; line-height: 1.04; text-wrap: balance; }
.sub { font-size: 25px; line-height: 1.4; color: rgba(255,255,255,.9); text-wrap: balance; }

.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip {
  display: inline-flex; align-items: center; gap: 9px; padding: 9px 15px;
  border: 1.5px solid rgba(255,255,255,.4); background: rgba(255,255,255,.12);
  font-size: 18px; font-weight: 700;
}
.chip svg, .list svg { flex: none; }
.chip svg { width: 15px; height: 15px; }

.list { list-style: none; display: grid; gap: 16px; font-size: 23px; font-weight: 700; }
.list li { display: flex; align-items: center; gap: 16px; }
.list .box { display: grid; place-items: center; width: 34px; height: 34px; flex: none; border: 1.5px solid rgba(255,255,255,.45); background: rgba(255,255,255,.12); }
.list .box svg { width: 18px; height: 18px; }
.list.on-white { color: var(--blue); }
.list.on-white .box { border-color: #c7d6f7; background: #eef3fe; }

.cta {
  position: absolute; z-index: 6; display: inline-flex; align-items: center; gap: 14px;
  padding: 18px 26px; background: var(--blue); color: #fff; font-size: 22px; font-weight: 700;
}
.cta svg { width: 22px; height: 22px; }
.count { position: absolute; z-index: 6; font-size: 16px; font-weight: 700; letter-spacing: .12em; color: #8fa0bf; }
.fine { font-size: 16px; color: rgba(255,255,255,.75); }

/* Devices */
.screen { position: relative; overflow: hidden; background: #fff; }
.screen iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; background: #fff; }
.laptop { position: absolute; z-index: 4; filter: drop-shadow(0 30px 40px rgba(6,20,60,.35)); }
.laptop .lid { background: #0d0f14; padding: 12px 12px 14px; border-radius: 16px 16px 0 0; }
.laptop .base {
  height: 20px; margin: 0 -52px; border-radius: 0 0 16px 16px; position: relative;
  background: linear-gradient(#f4f5f8, #cfd3db);
}
.laptop .base::after { content: ""; position: absolute; left: 50%; top: 0; width: 120px; height: 7px; margin-left: -60px; background: #b9bec8; border-radius: 0 0 8px 8px; }
.phone { position: absolute; z-index: 4; background: #0d0f14; padding: 12px; border-radius: 46px; filter: drop-shadow(0 30px 40px rgba(6,20,60,.4)); }
.phone .inner { border-radius: 35px; overflow: hidden; }
.phone .bar { height: 44px; }
.phone::before { content: ""; position: absolute; z-index: 2; left: 50%; top: 21px; width: 96px; height: 26px; margin-left: -48px; background: #0d0f14; border-radius: 14px; }

/* ---------- Slide 0: cover ---------- */
.cover .wedge { --a: 78%; --b: 64%; }
.cover .text { position: absolute; left: 80px; right: 80px; top: 128px; text-align: center; display: flex; flex-direction: column; align-items: center; }
.cover h1 { font-size: 74px; margin-top: 24px; }
.cover .sub { margin-top: 20px; max-width: 800px; }
.cover .chips { justify-content: center; margin-top: 26px; max-width: 860px; }
.cover .explore { margin-top: 26px; font-size: 23px; }
.cover .explore b { font-weight: 800; }
.cover .fine { margin-top: 8px; }
.cover .laptop { left: 222px; top: 636px; }

/* ---------- Layout B: laptop on top, bullets on white ---------- */
.b .wedge { --a: 73%; --b: 68%; }
.b .laptop { left: 222px; top: 118px; }
.b .text { position: absolute; left: 60px; right: 60px; top: 556px; text-align: center; display: flex; flex-direction: column; align-items: center; }
.b h1 { font-size: 54px; margin-top: 18px; }
.b .sub { margin-top: 12px; font-size: 23px; max-width: 880px; }
.b .list { position: absolute; left: 70px; top: 826px; z-index: 6; }
.b .cta { right: 60px; bottom: 96px; }
.b .count { right: 60px; bottom: 50px; }

/* ---------- Layout C: phone on one side, text on the other ---------- */
.c .wedge { --a: 80%; --b: 90%; }
.c .phone { left: 70px; top: 150px; }
.c .text { position: absolute; left: 452px; right: 60px; top: 190px; }
.c h1 { font-size: 62px; margin-top: 22px; }
.c .sub { margin-top: 18px; }
.c .list { margin-top: 30px; }
.c .cta { right: 60px; bottom: 60px; }
.c .count { left: 60px; bottom: 50px; }
.c.flip .wedge { --a: 90%; --b: 80%; }
.c.flip .phone { left: auto; right: 70px; }
.c.flip .text { left: 60px; right: 452px; }
.c.flip .cta { right: auto; left: 60px; }
.c.flip .count { left: auto; right: 60px; }

/* ---------- Layout D: text on the left, laptop running off the right edge ---------- */
.d .wedge { --a: 86%; --b: 70%; }
.d .text { position: absolute; left: 60px; top: 150px; width: 480px; }
.d h1 { font-size: 58px; margin-top: 22px; }
.d .sub { margin-top: 18px; font-size: 23px; }
.d .list { margin-top: 28px; font-size: 21px; }
.d .laptop { left: 590px; top: 250px; }
.d .cta { left: 60px; bottom: 60px; }
.d .count { right: 60px; bottom: 50px; }

/* ---------- Layout E: text on top, laptop and phone below ---------- */
.e .wedge { --a: 88%; --b: 78%; }
.e .text { position: absolute; left: 60px; right: 60px; top: 140px; }
.e h1 { font-size: 62px; margin-top: 20px; }
.e .sub { margin-top: 14px; max-width: 820px; }
.e .chips { margin-top: 22px; }
.e .laptop { left: 110px; top: 486px; }
.e .phone { left: 744px; top: 440px; }
.e .cta { right: 60px; bottom: 56px; }
.e .count { left: 60px; bottom: 50px; }
</style>
</head>
<body>
<script>
// ---- Settings -------------------------------------------------------------
const SITE = 'http://localhost:3001'          // running copy of the site, used for the screens
const URL_TEXT = 'bettercatarman.org'         // address printed on every slide

const check = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'
const arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>'
const pin = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 5-8 12-8 12s-8-7-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>'

const header = `<div class="top">
  <div class="brand"><img src="../public/logo-mark.svg" alt=""><span><b>BetterCatarman<i>.org</i></b><small>Northern Samar</small></span></div>
  <div class="place">${pin} Catarman, Northern Samar</div>
</div>`

// A live view of the site. w = viewport width the page is laid out at, scale = shrink
// factor, h = visible height on the slide, y = how far down the page to start.
const screen = ({ path, w, scale, h, y = 0 }) =>
  `<div class="screen" style="width:${Math.round(w * scale)}px;height:${h}px">
     <iframe src="${SITE}${path}" scrolling="no" style="width:${w}px;height:${Math.ceil(h / scale + y)}px;transform:scale(${scale}) translateY(-${y}px)"></iframe>
   </div>`
const laptop = s => `<div class="laptop"><div class="lid">${screen(s)}</div><div class="base"></div></div>`
// bar = colour of the strip behind the notch; match it to whatever is at the top of the screen.
const phone = ({ bar = '#1d4ed8', ...s }) => `<div class="phone"><div class="inner"><div class="bar" style="background:${bar}"></div>${screen({ ...s, h: s.h - 44 })}</div></div>`
const list = (items, cls = '') => `<ul class="list ${cls}">${items.map(i => `<li><span class="box">${check}</span>${i}</li>`).join('')}</ul>`
const chips = items => `<div class="chips">${items.map(i => `<span class="chip">${check}${i}</span>`).join('')}</div>`
const cta = `<div class="cta">Visit ${URL_TEXT} ${arrow}</div>`

const features = [
  {
    layout: 'b', tag: 'Services',
    title: 'What to bring, and which office to visit',
    sub: 'Requirements for 45 municipal and national services, written as plain checklists.',
    points: ['Requirements, fees, and the office for each service', 'Search by name, or browse by life event', 'Every checklist says where it came from'],
    devices: laptop({ path: '/services', w: 1280, scale: .48, h: 384, y: 104 }),
  },
  {
    layout: 'c', tag: 'Barangays',
    title: 'All 55 barangays, each with its own page',
    sub: 'Find any barangay, see where it is, and who leads it.',
    points: ['A map of every barangay', 'Barangay officials, from the DILG directory', 'Population from the census', 'Barangay hall contact, where listed'],
    devices: phone({ path: '/barangays', w: 390, scale: .82, h: 690, y: 0 }),
  },
  {
    layout: 'c flip', tag: 'Barangay officials',
    title: 'Know who leads your barangay',
    sub: 'Every barangay page lists its officials by name.',
    points: ['Punong Barangay (barangay captain)', 'Sangguniang Barangay members', 'SK Chairperson', 'Barangay Secretary'],
    devices: phone({ path: '/barangays/cawayan', w: 390, scale: .82, h: 690, y: 1580, bar: '#fff' }),
  },
  {
    layout: 'd', tag: 'Government',
    title: 'Know who runs the municipality',
    sub: 'The people and offices behind municipal services.',
    points: ['Mayor and vice mayor', 'Sangguniang Bayan members', 'Department heads and key offices', 'Phone numbers and email, where published'],
    devices: laptop({ path: '/government', w: 1180, scale: .56, h: 470, y: 352 }),
  },
  {
    layout: 'e', tag: 'Statistics',
    title: 'Catarman in numbers',
    sub: 'Census counts from 1903 to 2024, quick facts, and the population of each barangay.',
    chips: ['Population over time', 'Households and voters', 'Poverty incidence', 'Barangay populations'],
    devices: laptop({ path: '/statistics', w: 1280, scale: .44, h: 352, y: 300 }) + phone({ path: '/statistics', w: 390, scale: .6, h: 470, y: 706, bar: '#fff' }),
  },
  {
    layout: 'b', tag: 'Transparency',
    title: 'See how public money is spent',
    sub: 'Audited figures from the Commission on Audit’s own reports, year by year.',
    points: ['Income, expenses, assets, and liabilities, 2011 to 2025', 'What the auditor observed, and the LGU’s response', 'Links to official records and open data'],
    devices: laptop({ path: '/transparency', w: 1280, scale: .48, h: 384, y: 560 }),
  },
  {
    layout: 'c flip', tag: 'Hotlines and contact',
    title: 'Emergency numbers, one tap away',
    sub: 'Save them before you need them.',
    points: ['Police, fire, MDRRMO, and hospital', 'Tap a number to call', 'Hotlines on top of every page', 'Municipal Hall address, hours, and map'],
    devices: phone({ path: '/contact', w: 390, scale: .82, h: 690, y: 1345, bar: '#fff' }),
  },
  {
    layout: 'd', tag: 'About the data',
    title: 'Check where every fact comes from',
    sub: 'Nothing here asks to be taken on trust.',
    points: ['Every source listed, with a link', 'Each service marked by its source', 'What was changed by hand, and why', 'What the site does not know yet'],
    devices: laptop({ path: '/about', w: 1180, scale: .56, h: 470, y: 1500 }),
  },
]

const cover = `<section class="slide cover">
  <div class="wedge"></div>${header}
  <div class="text">
    <span class="tag">A community-run guide</span>
    <h1>Catarman’s public<br>information, in one place</h1>
    <p class="sub">Requirements, offices, barangays, and public records for every Catarmananon, made easier to find.</p>
    ${chips(['Services', 'Barangays', 'Government', 'Statistics', 'Transparency', 'Hotlines', 'Sources'])}
    <p class="explore">Explore it free at <b>${URL_TEXT}</b></p>
    <p class="fine">Built from official and public sources. Not the official website of the municipal government.</p>
  </div>
  ${laptop({ path: '/', w: 1280, scale: .48, h: 372, y: 0 })}
</section>`

const pad = n => String(n).padStart(2, '0')
const slides = [cover, ...features.map((f, i) => `<section class="slide ${f.layout}">
  <div class="wedge"></div>${header}
  ${f.devices}
  <div class="text">
    <span class="tag">Feature ${pad(i + 1)} · ${f.tag}</span>
    <h1>${f.title}</h1>
    <p class="sub">${f.sub}</p>
    ${f.chips ? chips(f.chips) : ''}
    ${f.points && !f.layout.startsWith('b') ? list(f.points) : ''}
  </div>
  ${f.points && f.layout.startsWith('b') ? list(f.points, 'on-white') : ''}
  ${cta}
  <div class="count">${pad(i + 1)} / ${pad(features.length)}</div>
</section>`)]

const only = new URLSearchParams(location.search).get('s')
if (only !== null) document.body.classList.add('single')
document.body.insertAdjacentHTML('beforeend', only !== null ? slides[+only] : slides.join(''))
</script>
</body>
</html>
